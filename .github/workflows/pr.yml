name: pr

# The only required status check is the literal string `ci-ok` (see the ruleset).
# Every gate job feeds that aggregator; a matrix suffix must never be a required
# check. `publish` and `deploy` are downstream of `ci-ok`, not part of it.
#
# The same eight gates run on pull_request and on push to the default branch
# (`master`). A branch that has never been merged has never run them.

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: pr-${{ github.ref }}
  # A queued PR run supersedes the previous one. A master run is not cancelled:
  # it may be midway through signing and pushing an image.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Engines are >=22 <23. The matrix exists so the one supported major is
        # named explicitly; ci-ok is what the ruleset requires, never `test (22)`.
        node: [22]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: invoice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:pg@localhost:5432/invoice_test?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test

  image:
    name: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - name: Build the image and load it into the local daemon
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          push: false
          # Without load: true the image never reaches the daemon and the trivy
          # job would scan nothing while reporting success.
          load: true
          tags: invoice-api:${{ github.sha }}
          cache-from: type=gha,scope=invoice-api
          # PR refs cannot seed master's cache; mode=max on every PR would
          # exhaust the 10 GB GHA cache budget. max only on the default branch.
          cache-to: type=gha,scope=invoice-api,mode=${{ github.ref == 'refs/heads/master' && 'max' || 'min' }}
      - name: Export the loaded image for the trivy job
        run: docker save invoice-api:${{ github.sha }} -o "${{ runner.temp }}/invoice-api.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: invoice-api-image
          path: ${{ runner.temp }}/invoice-api.tar
          retention-days: 1

  trivy:
    name: trivy
    # The scan consumes the artifact the `image` job uploads. Without this edge
    # both jobs start together, download-artifact runs before the upload exists,
    # and the gate dies with "Artifact not found" even though the image built
    # (run 40902199280). A missing dependency is not a scanner finding.
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: invoice-api-image
          path: ${{ runner.temp }}
      - name: Load the image built by the image job
        run: docker load --input "${{ runner.temp }}/invoice-api.tar"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-trivy-
      - name: Scan CRITICAL and HIGH with a failing exit code
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: invoice-api:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          cache-dir: ~/.cache/trivy
      - name: Keep the SARIF report when the scanner produced one
        # The gate is the scan step above. This preserves its report even when
        # that step exited 1. No file means the scan never completed, and the
        # failed step above already fails the job; do not add a second error.
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-results.sarif
          path: trivy-results.sarif
          retention-days: 1
          if-no-files-found: error
      - name: Check whether code scanning can accept the SARIF
        # This private repository has code scanning disabled, so upload-sarif
        # would fail with "Code scanning is not enabled" and turn a clean scan
        # red. Probe first; the report is already kept as an artifact above.
        id: code_scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?per_page=1")
          case "$status" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "code scanning accepts SARIF"
              ;;
            403|404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice::code scanning is not enabled for ${GITHUB_REPOSITORY}; SARIF kept as the trivy-results.sarif artifact"
              ;;
            *)
              echo "unexpected HTTP $status from the code-scanning API"
              exit 1
              ;;
          esac
      - name: Upload the scan result when code scanning is enabled
        if: always() && steps.code_scanning.outputs.enabled == 'true' && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migration-gate:
    name: migration-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Prisma needs the schema parameter; libpq (psql) rejects it as an unknown
      # URI parameter, so the fixture step uses PSQL_URL below.
      DATABASE_URL: postgresql://postgres:pg@localhost:5432/gate?schema=public
      PSQL_URL: postgresql://postgres:pg@localhost:5432/gate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Load the previous release's schema and rows
        run: psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f fixtures/pre-release.sql
      - name: Apply migrations under a lock timeout
        # migrate deploy opens its own session, so a prior SET would not apply.
        # PGOPTIONS is the only lever that reaches that session.
        run: PGOPTIONS='-c lock_timeout=3s -c statement_timeout=30s' npx prisma migrate deploy
      - name: Fail on schema drift
        # 0 = clean, 2 = drift, 1 = the command itself failed. Both non-zero
        # outcomes fail the gate; neither is swallowed.
        run: |
          set +e
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
          rc=$?
          set -e
          case "$rc" in
            0) echo "migration-gate: no drift" ;;
            2) echo "migration-gate: schema drift between the migrated database and prisma/schema.prisma"; exit 1 ;;
            *) echo "migration-gate: prisma migrate diff could not run (exit $rc)"; exit 1 ;;
          esac
      - name: Refuse destructive migrations without a label
        run: bash scripts/check-destructive.sh prisma/migrations

  bundle-size:
    name: bundle-size
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Enforce the dist budget
        run: |
          set -euo pipefail
          budget_kib=512
          kib=$(du -sk dist | cut -f1)
          echo "bundle-size: dist/ = ${kib} KiB (budget ${budget_kib} KiB)"
          if [ "$kib" -gt "$budget_kib" ]; then
            echo "bundle-size: dist/ exceeds the ${budget_kib} KiB budget"
            exit 1
          fi

  ci-ok:
    name: ci-ok
    # Runs even when an upstream job failed, so it can report the failure.
    if: always()
    needs: [lint, typecheck, test, image, trivy, gitleaks, migration-gate, bundle-size]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every gate must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' \
            || { echo "ci-ok: at least one gate did not succeed"; exit 1; }

  publish:
    name: publish
    # Master only. The PR lane stops at ci-ok; a dispatch of this workflow on
    # master also publishes, so the supply chain can be proved on demand.
    # `needs: ci-ok` means nothing is pushed unless all eight gates succeeded.
    if: github.ref == 'refs/heads/master'
    needs: [ci-ok]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/amine-gherbi/invoice-api:sha-${{ github.sha }}
            ghcr.io/amine-gherbi/invoice-api:latest
          # Same scope as the `image` job, so the second build reuses its layers
          # instead of compiling the service twice from scratch.
          cache-from: type=gha,scope=invoice-api
          cache-to: type=gha,scope=invoice-api,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the pushed digest keyless
        env:
          IMAGE: ghcr.io/amine-gherbi/invoice-api@${{ steps.build.outputs.digest }}
        # The OIDC token is the private half; no long-lived key exists.
        run: cosign sign --yes "$IMAGE"
      - name: Verify the signature against this workflow's identity
        env:
          IMAGE: ghcr.io/amine-gherbi/invoice-api@${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/Amine-Gherbi/cicd-pipeline/\.github/workflows/pr\.yml@refs/heads/master$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE"
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "image: ghcr.io/amine-gherbi/invoice-api@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${DIGEST}" > image-digest.txt
      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest.txt
          path: image-digest.txt
          if-no-files-found: error

  deploy:
    name: deploy
    # Master only. `needs: [ci-ok, publish]` means the deploy waits for the
    # signed image of the same commit, so the digest and the deploy describe
    # one commit. A pull request never reaches this job: its ref is refs/pull/N.
    if: github.ref == 'refs/heads/master'
    needs: [ci-ok, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RENDER_SERVICE_ID: srv-dbhni75g1s2s73ahheig
      PUBLIC_URL: https://invoice-api-26b4.onrender.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Refuse to deploy anything but master
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::deploy may only run on refs/heads/master (got $GITHUB_REF)"
            exit 1
          fi
          head=$(git rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::checked out $head but this run is for $GITHUB_SHA"
            exit 1
          fi
          echo "deploying master commit $GITHUB_SHA"

      - name: Trigger the Render deploy for this commit
        id: render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        # Render's API has no deploy-hook creation endpoint (probed 2026-10-29:
        # /deploy-hooks answers 404), so this job uses the API key instead. That
        # key can administer every service in the workspace; it is documented in
        # docs/PIPELINE.md as the wider permission this choice costs.
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::RENDER_API_KEY is not set"
            exit 1
          fi
          body=$(node -e 'process.stdout.write(JSON.stringify({commitId: process.argv[1]}))' "$COMMIT_SHA")
          response=$(curl -sS --fail-with-body --connect-timeout 10 --max-time 30 -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data "$body" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys")
          deploy_id=$(printf '%s' "$response" | node -e '
          let d = "";
          process.stdin.on("data", (c) => (d += c)).on("end", () => {
            const parsed = JSON.parse(d);
            const deploy = parsed.deploy ?? parsed;
            process.stdout.write(String(deploy.id ?? ""));
          });
          ')
          if [ -z "$deploy_id" ]; then
            echo "::error::Render did not return a deploy id"
            exit 1
          fi
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "triggered Render deploy $deploy_id for $COMMIT_SHA"

      - name: Wait for the Render deploy to finish (bounded 10 min)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_ID: ${{ steps.render.outputs.deploy_id }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            response=$(curl -sS --fail-with-body --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H 'Accept: application/json' \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}")
            status=$(printf '%s' "$response" | node -e '
            let d = "";
            process.stdin.on("data", (c) => (d += c)).on("end", () => {
              const parsed = JSON.parse(d);
              const deploy = parsed.deploy ?? parsed;
              process.stdout.write(String(deploy.status ?? "unknown"));
            });
            ')
            echo "deploy $DEPLOY_ID: $status"
            case "$status" in
              live)
                echo "deploy $DEPLOY_ID is live"
                exit 0
                ;;
              deactivated|canceled|build_failed|update_failed|pre_deploy_failed)
                echo "::error::deploy $DEPLOY_ID ended in $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::deploy $DEPLOY_ID did not reach live within 600s"
          exit 1

      - name: Wait for the public /health to answer 200 (bounded 6 min)
        # A free instance cold-starts in about a minute. The Render deploy can be
        # live before the instance is warm, so this waits separately.
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 360))
          while [ "$SECONDS" -lt "$deadline" ]; do
            code=000
            if out=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "$PUBLIC_URL/health" 2>/dev/null); then
              code=$out
            fi
            echo "$PUBLIC_URL/health -> $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::$PUBLIC_URL/health did not answer 200 within 360s"
          exit 1

      - name: Run the five smoke assertions against the public URL
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/smoke.sh "$PUBLIC_URL" | tee smoke-public.txt

      - name: Record the deploy in the run summary
        # Runs even when smoke failed: the run URL, deploy id and public URL are
        # what a reader needs to investigate. The failing step still fails the job.
        if: always()
        env:
          DEPLOY_ID: ${{ steps.render.outputs.deploy_id }}
        run: |
          {
            echo "### Deploy"
            echo ""
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Deploy id: ${DEPLOY_ID:-not triggered}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Public URL: ${PUBLIC_URL}/health"
            if [ -f smoke-public.txt ]; then
              echo ""
              echo '```text'
              cat smoke-public.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
