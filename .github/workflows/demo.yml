name: demo

# Dispatch-only lane for the one-screen demo page. It never publishes and
# never deploys: `gates` mirrors the eight gates in pr.yml, and `bad-image`
# proves the scanner can fail a run for a finding rather than for an echo.
#
# The demo page calls this workflow through the GitHub API; the browser never
# sees the dispatch token. The job names are the ones the page renders.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Which path to run'
        required: true
        type: choice
        options:
          - gates
          - bad-image

permissions: {}

# One demo action at a time, across the whole repository. The demo service
# also refuses a second request with 409; this is the second line of defence
# if the service restarts while a run is queued.
concurrency:
  group: pipeline-demo
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  # Node 18.12 on alpine 3.16.2, pinned by digest so the bad-image path is
  # reproducible. With `ignore-unfixed: true` this base still carries 46
  # CRITICAL/HIGH findings, e.g. libcrypto1.1 CVE-2022-4450 (HIGH, fixed in
  # 1.1.1t-r0). The trivy job below fails because the scanner found them.
  BAD_BASE: 'node:18.12.0-alpine@sha256:1f09c210a17508d34277971b19541a47a26dc5a641dedc03bd28cff095052996'

jobs:
  lint:
    name: lint
    if: github.event.inputs.action == 'gates'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    if: github.event.inputs.action == 'gates'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: test
    if: github.event.inputs.action == 'gates'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: invoice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:pg@localhost:5432/invoice_test?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test

  image:
    name: image
    if: github.event.inputs.action == 'gates'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image and load it into the local daemon
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          # Same invariant as pr.yml: the scanner can only scan what is loaded.
          load: true
          tags: invoice-api:demo-${{ github.sha }}
          cache-from: type=gha,scope=invoice-api
          cache-to: type=gha,scope=invoice-api,mode=min
      - name: Export the loaded image for the trivy job
        run: docker save invoice-api:demo-${{ github.sha }} -o "${{ runner.temp }}/invoice-api.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: invoice-api-image
          path: ${{ runner.temp }}/invoice-api.tar
          retention-days: 1

  trivy:
    name: trivy
    if: github.event.inputs.action == 'gates'
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: invoice-api-image
          path: ${{ runner.temp }}
      - name: Load the image built by the image job
        run: docker load --input "${{ runner.temp }}/invoice-api.tar"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-trivy-
      - name: Scan CRITICAL and HIGH with a failing exit code
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: invoice-api:demo-${{ github.sha }}
          format: table
          output: trivy-gates.txt
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          cache-dir: ~/.cache/trivy
      - name: Keep the scanner report
        if: always() && hashFiles('trivy-gates.txt') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-gates.txt
          path: trivy-gates.txt
          retention-days: 1
          if-no-files-found: error

  gitleaks:
    name: gitleaks
    if: github.event.inputs.action == 'gates'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migration-gate:
    name: migration-gate
    if: github.event.inputs.action == 'gates'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://postgres:pg@localhost:5432/gate?schema=public
      PSQL_URL: postgresql://postgres:pg@localhost:5432/gate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Load the previous release's schema and rows
        run: psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f fixtures/pre-release.sql
      - name: Apply migrations under a lock timeout
        run: PGOPTIONS='-c lock_timeout=3s -c statement_timeout=30s' npx prisma migrate deploy
      - name: Fail on schema drift
        run: |
          set +e
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
          rc=$?
          set -e
          case "$rc" in
            0) echo "migration-gate: no drift" ;;
            2) echo "migration-gate: schema drift between the migrated database and prisma/schema.prisma"; exit 1 ;;
            *) echo "migration-gate: prisma migrate diff could not run (exit $rc)"; exit 1 ;;
          esac
      - name: Refuse destructive migrations without a label
        run: bash scripts/check-destructive.sh prisma/migrations

  bundle-size:
    name: bundle-size
    if: github.event.inputs.action == 'gates'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Enforce the dist budget
        run: |
          set -euo pipefail
          budget_kib=512
          kib=$(du -sk dist | cut -f1)
          echo "bundle-size: dist/ = ${kib} KiB (budget ${budget_kib} KiB)"
          if [ "$kib" -gt "$budget_kib" ]; then
            echo "bundle-size: dist/ exceeds the ${budget_kib} KiB budget"
            exit 1
          fi

  bad-image-build:
    name: bad-image-build
    if: github.event.inputs.action == 'bad-image'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build from the pinned base digest
        run: |
          set -euo pipefail
          printf 'FROM %s\n' "$BAD_BASE" > "$RUNNER_TEMP/Dockerfile.bad-image"
          cat "$RUNNER_TEMP/Dockerfile.bad-image"
          docker build -f "$RUNNER_TEMP/Dockerfile.bad-image" -t "pipeline-demo-bad:${GITHUB_SHA}" .
          docker save "pipeline-demo-bad:${GITHUB_SHA}" -o "$RUNNER_TEMP/bad-image.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-demo-bad-image
          path: ${{ runner.temp }}/bad-image.tar
          retention-days: 1

  bad-image-trivy:
    name: bad-image-trivy
    if: github.event.inputs.action == 'bad-image'
    needs: [bad-image-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pipeline-demo-bad-image
          path: ${{ runner.temp }}
      - name: Load the image the build job produced
        run: docker load --input "${{ runner.temp }}/bad-image.tar"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-bad-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-trivy-
      - name: Scan the pinned base (this step is the red gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: pipeline-demo-bad:${{ github.sha }}
          format: table
          output: bad-image-trivy.txt
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          cache-dir: ~/.cache/trivy
      - name: Keep the scanner report
        if: always() && hashFiles('bad-image-trivy.txt') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bad-image-trivy.txt
          path: bad-image-trivy.txt
          retention-days: 1
          if-no-files-found: error
