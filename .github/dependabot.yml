version: 2
updates:
  # Workflow actions are pinned to full commit SHAs; Dependabot is what keeps
  # those SHAs current (and shows the version each SHA corresponds to).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
